apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-system-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-system-v2
  template:
    metadata:
      labels:
        app: hospital-system-v2
    spec:
      containers:
        - name: hospital-system
          image: YOUR_DOCKERHUB_USERNAME/hospital-system:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-system-v2
spec:
  type: NodePort
  selector:
    app: hospital-system-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
